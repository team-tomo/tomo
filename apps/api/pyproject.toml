[project]
name = "tomo-api"
version = "0.1.0"
description = "Tomo API"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.128.0",
    "pydantic-settings>=2.11.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.12.0",
    "pytest>=8.4.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
